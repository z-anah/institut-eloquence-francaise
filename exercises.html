<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="data.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>ThumbTap Learning</title>
</head>

<body class="bg-gray-900 text-white min-h-screen flex flex-col">
  <div class="flex-1"></div>

  <div id="app" class="p-4 space-y-3">
    <div
      class="bg-gray-800 py-5 rounded-xl text-center text-lg font-semibold active:scale-95 transition"
      @click="start"
    >
      Tap to Hear
    </div>
    <!-- return to index same style -->
    <a href="index.html"
      class="bg-gray-800 py-5 rounded-xl text-center text-lg font-semibold active:scale-95 transition block"
    >
      Back
    </a>
  </div>

  <script>
    const lesson = new URLSearchParams(location.search).get("lesson");

    Vue.createApp({
      methods: {
        start() {
          location.href = `player.html?lesson=${lesson}`;
        }
      }
    }).mount("#app");
  </script>
</body>
</html>
